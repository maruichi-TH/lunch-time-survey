<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0072bc">
<title>แบบสำรวจการใช้เวลาพักกลางวันและช่วงพัก | Asian Maruichi (Thailand)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==================== tokens ==================== */
:root{
  --brand:#0072bc; --brand-700:#005a97; --brand-300:#66aede; --brand-100:#d9ecf8; --brand-50:#eff7fc;
  --ink:#12293d; --ink-2:#3c5568; --muted:#7b91a4; --muted-2:#9bb0c1;
  --line:#dfe8f0; --line-2:#eef3f8; --surface:#fff; --bg:#f1f6fa;
  --ok:#2fa37c; --ok-bg:#e6f5ef; --warn:#d4574a; --warn-bg:#fdeceb;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(18,41,61,.05);
  --sh-2:0 10px 30px -12px rgba(0,114,188,.25);
  --sh-3:0 24px 60px -28px rgba(0,64,110,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","Inter",system-ui,sans-serif;font-size:15px;line-height:1.6;
  background-image:radial-gradient(900px 420px at 12% -8%,#e2f0fa 0,transparent 60%),radial-gradient(700px 380px at 96% 4%,#e8f3fb 0,transparent 55%);
  background-attachment:fixed}
h1,h2,h3{margin:0;letter-spacing:-.005em}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 56px}

/* ===== อังกฤษ = ภาษาที่สอง : อยู่ใต้ไทยเสมอ และเล็กกว่า ===== */
.en{display:block;font-family:"Inter",sans-serif;font-weight:400;color:var(--muted);
  font-size:.78rem;line-height:1.4;margin-top:2px;letter-spacing:0}

/* ==================== masthead ==================== */
.masthead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.masthead-top{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.logo{height:32px;width:auto;flex:none;display:block}
.masthead-div{width:1px;height:26px;background:var(--line);flex:none}
.masthead-org{font-family:"Inter",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--brand);line-height:1.5}
.masthead-body{padding:20px 24px 22px}
.chip{display:inline-block;white-space:nowrap;background:var(--brand-50);color:var(--brand-700);
  border:1px solid var(--brand-100);border-radius:999px;padding:4px 14px;
  font-size:.76rem;font-weight:600;line-height:1.7;margin:0 0 12px}
.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:middle}
.chip u{text-decoration:none;color:var(--muted);font-weight:500;font-family:"Inter",sans-serif;font-size:.71rem;margin-left:7px}
.masthead-body h1{font-size:1.28rem;font-weight:700;line-height:1.5}
.masthead-body h1 .en{font-size:.92rem;font-weight:600;color:var(--ink-2);margin-top:3px}
.sub{color:var(--ink-2);font-size:.9rem;margin:12px 0 0}

/* ==================== stepper ==================== */
.steps{display:flex;gap:6px;padding:0 24px 16px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font:700 11px/1 "Inter",sans-serif;background:var(--line-2);color:var(--muted);transition:.2s}
.step.done{background:var(--brand-100);color:var(--brand-700);cursor:pointer}
.step.now{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-50)}
.bar{height:5px;background:var(--line-2);border-radius:999px;margin:0 24px 18px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-300),var(--brand));transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ==================== page ==================== */
.page{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);margin-top:16px;padding:26px 24px 10px}
.page.on{display:block;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{border-bottom:1px solid var(--line-2);padding-bottom:18px}
.page-head h2{font-size:1.04rem;font-weight:700;line-height:1.5;margin-top:4px}
.page-head h2 .en{font-size:.8rem;font-weight:500}
.page-note{font-size:.83rem;color:var(--muted);margin:10px 0 0}
.page-note .en{font-size:.74rem;color:var(--muted-2)}

/* ==================== question ==================== */
.q{margin-top:26px;border:0;padding:0}
.q-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.q-no{flex:none;min-width:36px;height:24px;padding:0 7px;border-radius:8px;background:var(--brand-50);
  color:var(--brand-700);font:600 11.5px/23px "Inter",sans-serif;text-align:center;
  font-variant-numeric:tabular-nums;border:1px solid var(--brand-100)}
.q-text{font-weight:600;line-height:1.5;font-size:.98rem;padding:0;display:block}
.q-text .en{font-size:.8rem;font-weight:400;margin-top:3px}
.q-hint{display:block;font-size:.73rem;color:var(--muted-2);font-weight:500;margin-top:7px}
.opts{display:grid;gap:8px;padding-left:47px}
@media(min-width:760px){.opts.two{grid-template-columns:1fr 1fr}}

.opt{position:relative;display:flex;align-items:flex-start;gap:11px;cursor:pointer;
  border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:10px 14px;
  transition:border-color .16s,background .16s,box-shadow .16s}
.opt:hover{border-color:var(--brand-300);background:var(--brand-50)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.dot{flex:none;width:19px;height:19px;margin-top:3px;border-radius:50%;border:2px solid #b9c9d6;
  display:grid;place-items:center;background:#fff;transition:.16s}
.dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);transform:scale(0);
  transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
.opt input:checked~.dot{border-color:var(--brand)}
.opt input:checked~.dot::after{transform:scale(1)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-50);box-shadow:var(--sh-1)}
.opt input:focus-visible~.dot{box-shadow:0 0 0 4px var(--brand-100)}
.lbl{font-size:.92rem;line-height:1.45;font-weight:500}
.lbl .en{font-size:.75rem;font-weight:400}

.field{padding-left:47px;margin-top:12px}
.field>label{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field>label .en{font-size:.73rem;font-weight:400}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fbfdfe;
  padding:11px 14px;font:inherit;font-size:.93rem;color:var(--ink);transition:.16s}
input[type=text]::placeholder{color:#a9bbc9}
input[type=text]:hover{border-color:var(--brand-300)}
input[type=text]:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-100)}
input[type=text].err{border-color:var(--warn);background:#fffafa}

.branch{margin-left:47px;margin-top:16px;padding-left:18px;border-left:2px dashed var(--brand-100)}
.branch .opts,.branch .field{padding-left:0}
.branch .q{margin-top:2px}

.grid2{display:grid;gap:16px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid2 .field{padding-left:0;margin-top:0}
.hide{display:none!important}

/* ==================== nav ==================== */
.nav{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);
  border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);
  padding:16px 24px;margin-top:-1px;box-shadow:var(--sh-2)}
.btn{border:0;border-radius:var(--r-md);padding:9px 20px;font:600 .9rem/1.35 inherit;cursor:pointer;transition:.16s;text-align:center}
.btn .en{font-size:.69rem;margin-top:1px}
.btn:focus-visible{outline:3px solid var(--brand-300);outline-offset:2px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(0,114,188,.6)}
.btn-primary .en{color:rgba(255,255,255,.72)}
.btn-primary:hover:not(:disabled){background:var(--brand-700)}
.btn-primary:disabled{opacity:.55;cursor:default;box-shadow:none}
.btn-ghost{background:#fff;color:var(--brand-700);border:1.5px solid var(--line)}
.btn-ghost .en{color:var(--muted)}
.btn-ghost:hover{border-color:var(--brand-300);background:var(--brand-50)}
.invis{visibility:hidden}
.count{font:600 .78rem "Inter",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

.alert{background:var(--warn-bg);color:#93312a;border:1px solid #f6c9c4;border-radius:var(--r-md);
  padding:12px 16px;font-size:.88rem;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.alert::before{content:"!";flex:none;width:19px;height:19px;border-radius:50%;background:var(--warn);
  color:#fff;font:700 12px/19px "Inter";text-align:center}
.alert .en{color:#b06e66;font-size:.75rem}

/* ==================== finish ==================== */
.finish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);margin-top:16px;padding:54px 28px;text-align:center}
.mark{width:62px;height:62px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;
  place-items:center;margin:0 auto 20px;font-size:30px;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.finish h2{font-size:1.18rem;font-weight:700}
.finish h2 .en{font-size:.84rem;font-weight:500}
.finish p{color:var(--ink-2);max-width:460px;margin:14px auto 0;font-size:.93rem}
.finish .logo{height:24px;opacity:.45;margin:30px auto 0}
#debug{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:260px;
  overflow:auto;text-align:left;background:var(--bg);border-radius:var(--r-sm);padding:14px;margin-top:26px}

@media(max-width:560px){
  .opts,.field{padding-left:0}
  .branch{margin-left:0}
  .wrap{padding:16px 12px 40px}
  .page{padding:20px 16px 10px}
  .masthead-top,.masthead-body{padding-left:18px;padding-right:18px}
  .steps,.bar{margin-left:18px;margin-right:18px;padding-left:0;padding-right:0}
  .nav{padding:14px 16px;gap:8px}
  .btn{padding:9px 14px;font-size:.85rem}
  .masthead-org{font-size:10px;letter-spacing:.06em}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  T('ไม่มีทั้งโต๊ะและเก้าอี้ (ปูเสื่อ/แผ่นรองบนพื้นแล้วนั่งหรือนอน)','There is neither a table nor chairs (a mat/pad is laid on the floor and you sit or lie on it).'),
  T('ไม่มีทั้งโต๊ะและเก้าอี้ (นั่งหรือนอนบนพื้นโดยตรง)','There is neither a table nor chairs (you sit or lie directly on the floor).'),
  OTHER
];
const CONDITION = [
  T('พื้นที่ที่มีเครื่องปรับอากาศ','Air-conditioned area'),
  T('พื้นที่ที่มีพัดลม','Fan-cooled area'),
  T('พื้นที่ที่ไม่มีทั้งเครื่องปรับอากาศและพัดลม','Area without both air conditioning and a fan'),
  OTHER
];
const ACT_EAT = T('รับประทานอาหาร/ของว่าง','Eat meals/ snacks');
const ACTIVITIES = [ACT_EAT,
  T('พูดคุยกับเพื่อน','Talk to friends'),
  T('สูบบุหรี่','Smoke'),
  T('อ่านหนังสือ','Read a book'),
  T('ใช้โทรศัพท์มือถือ','Use mobile phone'),
  T('นอนหลับ','Sleeping'),
  T('พักผ่อน','Relax'),
  OTHER
];
const EAT = T('รับประทาน','Eat'), NO_EAT = T('ไม่รับประทาน','Do not eat');

const INTRO_P1   = T('กรุณากรอกข้อมูลผู้ตอบแบบสำรวจ','Enter the status of the survey respondent');
const INTRO_NOW  = T('กรุณากรอกว่าปัจจุบันคุณใช้เวลาพักกลางวันและช่วงพักอื่น ๆ อย่างไร','Enter how do you currently use your lunch breaks and other breaks?');
const INTRO_WANT = T('กรุณากรอกว่าในอนาคตคุณต้องการใช้เวลาพักอย่างไร (ความต้องการ / ความคาดหวัง)','Please enter how you want to spend your breaks in the future. (Requirements / Expectations)');
const PHASE_P1   = T('ข้อมูลผู้ตอบ','Respondent');
const PHASE_NOW  = T('สภาพปัจจุบัน','Current situation');
const PHASE_WANT = T('สิ่งที่ต้องการ','Desired situation');
const NOTE_NOW   = T('ตอบตามสิ่งที่คุณทำอยู่จริงในปัจจุบัน','Answer based on what you actually do now');
const NOTE_WANT  = T('ตอบตามสิ่งที่คุณต้องการให้เป็น','Answer based on what you would like');
const SPECIFY    = T('โปรดระบุ','Please specify');
const PLACEHOLDER= 'พิมพ์คำตอบของคุณ / Type your answer';

const PARTS = [
  {n:1, key:'now_meal',        kind:'meal', future:false, title:T('พักกลางวัน: ช่วงรับประทานอาหาร','Lunch Break: Mealtime')},
  {n:2, key:'now_afterlunch',  kind:'rest', future:false, noEatAct:true, title:T('พักกลางวัน: ช่วงหลังรับประทานอาหาร','Lunch Break: The Period after Lunch')},
  {n:3, key:'now_morning',     kind:'rest', future:false, title:T('พักช่วงเช้า 10:00 น.','Morning Break 10:00 AM')},
  {n:4, key:'now_afternoon',   kind:'rest', future:false, title:T('พักช่วงบ่าย 15:00 น.','Afternoon Break at 3:00 PM')},
  {n:5, key:'now_evening',     kind:'rest', future:false, title:T('พักก่อนเริ่มทำงานล่วงเวลา 17:00–17:20 น.','Evening break before starting overtime work 5:00 PM–5:20 PM')},
  {n:6, key:'want_meal',       kind:'meal', future:true,  title:T('พักกลางวัน: ช่วงรับประทานอาหาร','Lunch Break: Mealtime')},
  {n:7, key:'want_afterlunch', kind:'rest', future:true, noEatAct:true, title:T('พักกลางวัน: ช่วงหลังรับประทานอาหาร','Lunch Break: The Period after Lunch')},
  {n:8, key:'want_morning',    kind:'rest', future:true,  title:T('พักช่วงเช้า 10:00 น.','Morning Break 10:00 AM')},
  {n:9, key:'want_afternoon',  kind:'rest', future:true,  title:T('พักช่วงบ่าย 15:00 น.','Afternoon Break at 3:00 PM')},
  {n:10,key:'want_evening',    kind:'rest', future:true,  title:T('พักก่อนเริ่มทำงานล่วงเวลา 17:00–17:20 น.','Evening break before starting overtime work 5:00 PM–5:20 PM')}
];

/* ==========================================================
   builders
   ========================================================== */
function opt(name,o){
  return `<label class="opt"><input type="radio" name="${name}" value="${esc(o.v)}"><span class="dot"></span><span class="lbl">${o.h}</span></label>`;
}
function group(num,q,name,choices){
  const hasOther = choices.some(c=>c.v===OTHER.v);
  const otherWrap = hasOther
    ? `<div id="${name}-other-wrap" class="field hide"><label for="${name}-other">${SPECIFY.h}</label>
       <input id="${name}-other" name="${name}_other" type="text" maxlength="120" placeholder="${esc(PLACEHOLDER)}"></div>`
    : '';
  return `<fieldset class="q">
    <div class="q-head">${num?`<span class="q-no">${num}</span>`:''}
      <legend class="q-text">${q.h}<span class="q-hint">${esc(HINT.th)} &middot; ${esc(HINT.en)}</span></legend></div>
    <div class="opts${choices.length>3?' two':''}">${choices.map(c=>opt(name,c)).join('')}</div>
    ${otherWrap}</fieldset>`;
}
function freeText(num,q,name){
  return `<fieldset class="q">
    <div class="q-head">${num?`<span class="q-no">${num}</span>`:''}
      <legend class="q-text">${q.h}<span class="q-hint">${esc(SPECIFY.th)} &middot; ${esc(OTHER.en)}</span></legend></div>
    <div class="field"><input id="${name}" name="${name}" type="text" maxlength="120" placeholder="${esc(PLACEHOLDER)}"></div>
  </fieldset>`;
}
function whereBlock(p,num,kind,future){
  const q = kind==='meal'
    ? (future?T('คุณต้องการรับประทานอาหารกลางวันที่ไหน','Where do you want to have lunch?'):T('คุณรับประทานอาหารกลางวันที่ไหน','Where do you have lunch?'))
    : (future?T('คุณต้องการพักที่ไหน','Where do you want to take a break?'):T('คุณพักที่ไหน','Where do you take a break?'));
  return group(num,q,`${p}_where`,[B1,B2,OUTB,kind==='meal'?OUT_EAT:OUT_REST])
       + `<div id="${p}-branch" class="branch hide"></div>`;
}
function buildPart(part){
  const {n,key:p,kind,future,noEatAct} = part;
  let h='';
  if(kind==='meal'){
    h += group(`${n}.1`, future?T('คุณต้องการรับประทานอาหารกลางวันหรือไม่','Whether do you want to have lunch or not?')
                               :T('คุณรับประทานอาหารกลางวันหรือไม่','Whether do you have lunch or not?'),
               `${p}_eat`,[EAT,NO_EAT]);
    h += `<div id="${p}-followup" class="hide">`;
    h += group(`${n}.2`, future?T('คุณต้องการรับประทานอาหารกลางวันกับกี่คน','How many people do you want to have lunch with?')
                               :T('คุณรับประทานอาหารกลางวันกับกี่คน','How many people do you have lunch with?'),
               `${p}_with`,PEOPLE);
    h += whereBlock(p,`${n}.3`,kind,future);
    h += group(`${n}.4`, future?T('คุณต้องการรับประทานอาหารในพื้นที่ลักษณะใด','What is the type of area where you want to eat?')
                               :T('คุณรับประทานอาหารในพื้นที่ลักษณะใด','What is the type of place where you eat?'),
               `${p}_place_type`,PLACE_TYPE);
    h += group(`${n}.5`, future?T('คุณต้องการรับประทานอาหารในสภาพแวดล้อมแบบใด','What is the type of condition where you want to eat?')
                               :T('คุณรับประทานอาหารในสภาพแวดล้อมแบบใด','What is the type of condition where you eat?'),
               `${p}_condition`,CONDITION);
    h += `</div>`;
  } else {
    h += group(`${n}.1`, future?T('คุณต้องการพักกับกี่คน','How many people do you want to take your break with?')
                               :T('คุณพักกับกี่คน','How many people do you take your break with?'),
               `${p}_with`,PEOPLE);
    h += whereBlock(p,`${n}.2`,kind,future);
    h += group(`${n}.3`, future?T('คุณต้องการทำอะไรในช่วงพัก','What do you want to do?')
                               :T('คุณทำอะไรในช่วงพัก','What do you do?'),
               `${p}_activities`, noEatAct?ACTIVITIES.filter(x=>x.v!==ACT_EAT.v):ACTIVITIES);
    h += group(`${n}.4`, future?T('คุณต้องการพักในพื้นที่ลักษณะใด','What is the type of place where you want to take a break?')
                               :T('คุณพักในพื้นที่ลักษณะใด','What is the type of place where you take a break?'),
               `${p}_place_type`,PLACE_TYPE);
    h += group(`${n}.5`, future?T('คุณต้องการพักในสภาพแวดล้อมแบบใด','What is the type of condition where you want to take a break?')
                               :T('คุณพักในสภาพแวดล้อมแบบใด','What is the type of condition where you take a break?'),
               `${p}_condition`,CONDITION);
  }
  return h;
}

/* ---------- pages ---------- */
const NAME_L = T('ชื่อ-นามสกุล','Name-Surname');
const EID_L  = T('รหัสพนักงาน (ตัวเลขเท่านั้น)','Employee ID (numbers only)');
const DEPT_L = T('แผนก / กลุ่มงาน','Department / Group');
const LOC_L  = T('พื้นที่ทำงานหลักของคุณ','Your Primary Work Location');

let H = `<section id="pg1" class="page">
  <div class="page-head"><span class="chip"><i></i>หน้า 1<u>Page 1</u></span>
    <h2>ข้อมูลผู้ตอบแบบสำรวจ<span class="en">Survey respondent</span></h2></div>
  <div class="q"><div class="grid2">
    <div class="field"><label for="fn">${NAME_L.h}</label>
      <input id="fn" name="full_name" type="text" required maxlength="80" placeholder="${esc(PLACEHOLDER)}"></div>
    <div class="field"><label for="eid">${EID_L.h}</label>
      <input id="eid" name="employee_id" type="text" required maxlength="10" inputmode="numeric" autocomplete="off" placeholder="0000"></div>
  </div></div>
  ${group('',DEPT_L,'department',DEPARTMENTS)}
  ${group('',LOC_L,'workplace',WORK_LOCATIONS)}
</section>`;

PARTS.forEach((part,i)=>{
  const note = part.future?NOTE_WANT:NOTE_NOW;
  H += `<section id="pg${i+2}" class="page">
    <div class="page-head"><span class="chip"><i></i>หน้า ${i+2} &middot; ส่วนที่ ${part.n}<u>Page ${i+2} &middot; Part ${part.n}</u></span>
      <h2>${part.title.h}</h2>
      <p class="page-note">${note.h}</p></div>
    ${buildPart(part)}</section>`;
});
document.getElementById('pages').innerHTML = H;

const pages = [...document.querySelectorAll('.page')];
const TOTAL = pages.length;
document.getElementById('steps').innerHTML =
  Array.from({length:TOTAL+1},(_,i)=>`<div class="step" data-i="${i+1}">${i+1===TOTAL+1?'&#10003;':i+1}</div>`).join('');
const stepEls = [...document.querySelectorAll('.step')];

/* ==========================================================
   state
   ========================================================== */
const form = document.getElementById('form');
let page = 1;

const shown  = x => !x.closest('.hide');
const picked = n => [...form.querySelectorAll(`[name="${n}"]:checked`)].filter(shown)[0]?.value || '';
const val    = n => { const el=form.querySelector(`[name="${n}"]`); return el && shown(el) ? el.value.trim() : ''; };

const eid = document.getElementById('eid');
eid.addEventListener('input',()=>{
  const clean = eid.value.replace(/\D/g,'');
  if(clean!==eid.value) eid.value = clean;
  eid.classList.remove('err');
});
eid.addEventListener('paste',e=>{
  e.preventDefault();
  eid.value = ((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,10);
});

function syncOther(name){
  const wrap = document.getElementById(name+'-other-wrap'); if(!wrap) return;
  const on = [...form.querySelectorAll(`[name="${name}"]:checked`)].some(x=>x.value===OTHER.v);
  wrap.classList.toggle('hide',!on);
  const i = wrap.querySelector('input'); i.required = on; if(!on) i.value='';
}
function syncWhere(part){
  const p = part.key;
  const base = part.kind==='meal' ? `${part.n}.3` : `${part.n}.2`;
  const where = picked(`${p}_where`);
  const br = document.getElementById(`${p}-branch`);
  const list = [B1,B2,OUTB, part.kind==='meal'?OUT_EAT:OUT_REST];
  const idx = list.findIndex(o=>o.v===where);
  if(idx<0){ br.innerHTML=''; br.dataset.sel=''; br.classList.add('hide'); return; }
  br.classList.remove('hide');
  if(br.dataset.sel===where) return;
  br.innerHTML = idx===3 ? freeText(`${base}.4`,list[3],`${p}_where_out`)
                         : group(`${base}.${idx+1}`,list[idx],`${p}_where_detail`,DETAIL[where]);
  br.dataset.sel = where;
  syncOther(`${p}_where_detail`);
  const f = br.querySelector(`[name="${p}_where_out"]`); if(f) f.required = true;
}
function syncAll(){
  PARTS.forEach(part=>{
    if(part.kind==='meal'){
      const on = picked(`${part.key}_eat`)===EAT.v;
      document.getElementById(`${part.key}-followup`).classList.toggle('hide',!on);
      if(!on) return;
    }
    syncWhere(part);
  });
  [...new Set([...form.querySelectorAll('input[type=radio]')].map(x=>x.name))].forEach(syncOther);
}
form.addEventListener('change',()=>{ syncAll(); hideErr(); });

/* ==========================================================
   nav + validate
   ========================================================== */
const errBox = document.getElementById('err');
const hideErr = ()=> errBox.classList.add('hide');
const showErr = o=>{ errBox.innerHTML = `<div>${o.h}</div>`; errBox.classList.remove('hide');
  errBox.scrollIntoView({block:'nearest',behavior:'smooth'}); };

function validate(p){
  const inputs = [...pages[p-1].querySelectorAll('input')].filter(shown);
  if(p===1){
    if(!val('full_name')){ showErr(T('กรุณากรอกชื่อ-นามสกุล','Please enter your name.')); document.getElementById('fn').focus(); return false; }
    if(!/^\d+$/.test(val('employee_id'))){
      showErr(T('รหัสพนักงานต้องเป็นตัวเลขเท่านั้น','Employee ID must contain numbers only.'));
      eid.classList.add('err'); eid.focus(); return false;
    }
  }
  for(const x of inputs) if(x.type==='text' && x.required && !x.value.trim()){
    showErr(T('กรุณากรอกรายละเอียดที่จำเป็นก่อนดำเนินการต่อ','Please fill in the required details before continuing.'));
    x.focus(); return false; }
  for(const n of new Set(inputs.filter(x=>x.type==='radio').map(x=>x.name))) if(!picked(n)){
    showErr(T('กรุณาเลือกคำตอบ 1 ข้อก่อนดำเนินการต่อ','Please select one answer before continuing.')); return false; }
  return true;
}
function render(p){
  page = Math.max(1,Math.min(TOTAL,p));
  pages.forEach((x,i)=>x.classList.toggle('on', i===page-1));
  const intro = page===1 ? INTRO_P1 : (PARTS[page-2].future?INTRO_WANT:INTRO_NOW);
  const phase = page===1 ? PHASE_P1 : (PARTS[page-2].future?PHASE_WANT:PHASE_NOW);
  document.getElementById('intro').innerHTML = intro.h;
  document.getElementById('chip-th').textContent = phase.th;
  document.getElementById('chip-en').textContent = phase.en;
  document.getElementById('count').textContent = `${page} / ${TOTAL+1}`;
  document.getElementById('bar').style.width = (page/(TOTAL+1)*100)+'%';
  stepEls.forEach((el,i)=>{ el.className = 'step'+(i+1<page?' done':i+1===page?' now':''); });
  document.getElementById('prev').classList.toggle('invis',page===1);
  document.getElementById('next').classList.toggle('hide',page===TOTAL);
  document.getElementById('send').classList.toggle('hide',page!==TOTAL);
  hideErr();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('next').onclick = ()=>{ if(validate(page)) render(page+1); };
document.getElementById('prev').onclick = ()=> render(page-1);
stepEls.forEach(el=>el.onclick = ()=>{ const i=+el.dataset.i; if(i<page) render(i); });

/* ==========================================================
   payload → Google Sheet
   ========================================================== */
function withOther(n){ const v=picked(n); return v===OTHER.v ? `${OTHER.v}: ${val(n+'_other')}` : v; }
function buildRow(){
  const row = {
    submitted_at:new Date().toISOString(),
    full_name:val('full_name'),
    employee_id:val('employee_id'),
    department:withOther('department'),
    workplace:picked('workplace')
  };
  PARTS.forEach(part=>{
    const p = part.key;
    if(part.kind==='meal') row[`${p}_eat`] = picked(`${p}_eat`);
    row[`${p}_with`]         = picked(`${p}_with`);
    row[`${p}_where`]        = picked(`${p}_where`);
    row[`${p}_where_detail`] = withOther(`${p}_where_detail`);
    row[`${p}_where_out`]    = val(`${p}_where_out`);
    if(part.kind==='rest') row[`${p}_activity`] = withOther(`${p}_activities`);
    row[`${p}_place_type`]   = withOther(`${p}_place_type`);
    row[`${p}_condition`]    = withOther(`${p}_condition`);
  });
  return row;
}
async function postRow(row){
  const res = await fetch(CONFIG.ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({token:CONFIG.TOKEN,row})
  });
  const d = await res.json();
  if(!d.ok) throw new Error(d.error||'server rejected');
  return d;
}
form.addEventListener('submit', async e=>{
  e.preventDefault();
  if(!validate(TOTAL)) return;
  const btn = document.getElementById('send'), row = buildRow();
  if(CONFIG.DEBUG){
    const d = document.getElementById('debug');
    d.classList.remove('hide'); d.textContent = JSON.stringify(row,null,2);
  }
  if(!CONFIG.ENDPOINT.startsWith('https://')){
    if(CONFIG.DEBUG){ done(); return; }
    showErr(T('ยังไม่ได้ตั้งค่าปลายทางบันทึกข้อมูล กรุณาแจ้งฝ่าย IT','The destination is not configured. Please contact IT.'));
    return;
  }
  btn.disabled = true;
  btn.innerHTML = 'กำลังส่ง…<span class="en">Sending…</span>';
  let last;
  for(let i=0;i<=CONFIG.RETRY;i++){
    try{ await postRow(row); done(); return; }
    catch(err){ last = err; await new Promise(r=>setTimeout(r,800*(i+1))); }
  }
  console.error(last);
  showErr(T('ส่งไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อแล้วกดส่งอีกครั้ง','Could not send. Check your connection and press send again.'));
  btn.disabled = false;
  btn.innerHTML = 'ส่งแบบสำรวจ<span class="en">Send survey</span>';
});
function done(){
  form.classList.add('hide');
  document.getElementById('finish').classList.remove('hide');
  document.getElementById('intro').textContent = '';
  document.getElementById('chip-th').textContent = 'ส่งเรียบร้อย';
  document.getElementById('chip-en').textContent = 'Submitted';
  document.getElementById('bar').style.width = '100%';
  stepEls.forEach(el=>el.className='step done');
  stepEls[stepEls.length-1].className = 'step now';
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('beforeunload',e=>{
  if(document.getElementById('finish').classList.contains('hide') && page>1){ e.preventDefault(); e.returnValue=''; }
});

syncAll(); render(1);
</script>
